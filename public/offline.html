<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0908" />
    <title>डीलक्स सैलून — ऑफ़लाइन</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Noto Sans Devanagari", "Hiragino Sans", system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0a0908;
        color: #f3ebe0;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: clamp(1.8rem, 6vw, 3rem);
        letter-spacing: -0.03em;
        margin: 0 0 0.6rem;
      }
      p {
        margin: 0;
        max-width: 22rem;
        line-height: 1.45;
        opacity: 0.8;
      }
      a {
        color: #e8a07a;
        display: inline-block;
        margin-top: 1.4rem;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>डीलक्स सैलून</h1>
      <p>आप ऑफ़लाइन हैं। एक बार ऑनलाइन खोलकर ऐप सेव करें — फिर यह पेज बिना नेट के खुलता रहेगा। गाने के लिए इंटरनेट चाहिए।</p>
      <a href="/">फिर से कोशिश करें</a>
    </div>
  </body>
</html>
